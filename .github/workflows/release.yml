# Releasing = creating a release in the GitHub UI (new tag vX.Y.Z on main →
# Publish). Publishing creates the tag, which triggers this workflow to build
# the images — the app version is stamped FROM THE TAG at build time
# (extraMetadata.version), so no version-bump commit is needed; the version in
# packages/desktop/package.json only matters for local dev builds. Uses the
# same signing secrets as desktop-images.yml; missing secrets degrade to
# unsigned artifacts.
#
# Structure: both platform builds upload artifacts, then ONE publish job
# attaches everything to the release — electron-builder's own --publish always
# races when two matrix jobs try to touch the same release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  guard:
    name: tag is a semver version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the tag becomes the app version verbatim — the in-app updater compares
      # it numerically, so anything but vMAJOR.MINOR.PATCH must not build
      - run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH — use e.g. v0.2.1 when creating the release"
            exit 1
          fi

  build:
    name: build (${{ matrix.name }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # The single --mac --arm64 --x64 invocation is LOAD-BEARING for
          # auto-update: one job emits ONE latest-mac.yml listing both arches'
          # zips, and electron-updater picks by process.arch. Splitting per-arch
          # (as desktop-images.yml does) makes two latest-mac.yml uploads
          # clobber each other and silently breaks updates for one arch.
          - name: macos
            os: macos-latest
            args: --mac --arm64 --x64
            artifacts: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*.zip
              packages/desktop/release/*.blockmap
              packages/desktop/release/latest-mac.yml
          - name: windows
            os: windows-latest
            args: --win
            artifacts: |
              packages/desktop/release/*.exe
              packages/desktop/release/*.blockmap
              packages/desktop/release/latest.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Package image
        shell: bash
        env:
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CERTS_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          EXTRA=""
          if [[ "${{ matrix.name }}" == "macos" ]]; then
            if [[ -z "$CSC_LINK" ]]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            fi
            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" && -n "${CSC_LINK:-}" ]]; then
              EXTRA="-c.mac.notarize=true"
            else
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            fi
          fi
          # stamp the app version from the tag — app.getVersion(), the artifact
          # names and latest*.yml all pick it up; no version-bump commit needed
          npm run dist -w @dcl-editor/desktop -- ${{ matrix.args }} $EXTRA -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # A release missing the update metadata would brick every installed
      # client's update check the moment it's published — refuse to create it.
      - name: Assert auto-update artifacts are present
        run: |
          missing=0
          for f in latest-mac.yml latest.yml; do
            [[ -f "dist/$f" ]] || { echo "::error::dist/$f missing"; missing=1; }
          done
          ls dist/*-mac-arm64.zip dist/*-mac-x64.zip >/dev/null 2>&1 || { echo "::error::mac update zips missing"; missing=1; }
          exit $missing
      # Releases are created in the GitHub UI ONLY — publishing there creates
      # the v* tag, which triggers this workflow to build and attach the
      # images. Once they land, every installed app picks the release up within
      # hours (in-app auto-update). A bare CLI tag is refused on purpose.
      # Never delete latest*.yml / zip / blockmap assets from a published release.
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release named $GITHUB_REF_NAME — create the release in the GitHub UI (which creates the tag); bare CLI tags are not part of the flow"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      # Unsigned builds trip Gatekeeper's "damaged" dialog on first install —
      # every release page carries the fix, right next to the download. The
      # marker keeps this idempotent across workflow re-runs, and the
      # hand-written notes always stay on top. Drop this step when builds are
      # signed + notarized.
      - name: Append the macOS install note to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER='<!-- macos-install-note -->'
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          grep -qF "$MARKER" notes.md && exit 0
          cat >> notes.md <<'EOF'

          <!-- macos-install-note -->
          ---
          ### Installing on macOS

          If macOS says **“Bevy Scene Editor is damaged and can’t be opened”** — the app isn’t damaged. It just isn’t signed with an Apple certificate yet, and macOS shows this for any unsigned app downloaded from a browser. After dragging the app to Applications, run this once in Terminal:

          ```
          xattr -d com.apple.quarantine "/Applications/Bevy Scene Editor.app"
          ```

          then open it normally. This is only needed on the first install — from then on the editor updates itself automatically and the dialog never appears again.
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
