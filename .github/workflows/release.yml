# Tag a release (git tag v0.2.0 && git push --tags) → build signed images and
# publish them to a GitHub Release. The tag must match the desktop package
# version (electron-builder names the release after it). Uses the same signing
# secrets as desktop-images.yml; missing secrets degrade to unsigned artifacts.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # electron-builder creates the GitHub Release

jobs:
  release:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --mac
          - name: windows
            os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CERTS_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [[ "${{ matrix.name }}" == "macos" ]]; then
            if [[ -z "$CSC_LINK" ]]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            elif [[ -n "$APPLE_ID" ]]; then
              EXTRA="-c.mac.notarize=true"
            fi
          fi
          npm run stage -w @dcl-editor/desktop
          npx electron-builder --project packages/desktop ${{ matrix.args }} $EXTRA --publish always
