# Build installable desktop images (macOS dmg, Windows installer) on every PR
# and on every push to main, attach them as workflow artifacts, and gate their
# size against the latest main build's measurements (see the `size` job at the
# bottom; budgets live in app-size.json).
#
# Signing policy:
#   - PR builds are always UNSIGNED and see no signing secrets at all (fork
#     PRs can't see secrets anyway, and unsigned is faster for review
#     artifacts).
#   - main builds sign when the cert secrets exist, and notarize the mac image
#     when ALL THREE APPLE_* secrets exist. Missing or partial secrets degrade
#     to unsigned/unnotarized — the build never fails over signing config.
#
# Repo secrets used (all optional): MAC_CERTS (base64 .p12), MAC_CERTS_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, WIN_CSC_LINK (base64
# .pfx), WIN_CSC_KEY_PASSWORD.
name: desktop images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the artifact-link comment on PRs
  actions: read # the size baseline: artifacts of the latest main run

concurrency:
  group: desktop-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --mac
            # arm64 only — the x64 dmg (main builds) gets its own artifact below
            # so nobody downloads 400MB for one architecture
            artifact: bevy-editor-macos-arm64
            artifacts: packages/desktop/release/*-arm64.dmg
          - name: windows
            os: windows-latest
            args: --win
            artifact: bevy-editor-windows
            artifacts: packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the full gate (typecheck + unit tests + build) — packaging a broken
      # build is worse than a slower job
      - run: npm run validate
      - name: Package image
        shell: bash
        env:
          # every signing env var is push-gated AND scoped to its platform job —
          # PR builds (which never sign) must not see credentials at all
          CSC_LINK: ${{ matrix.name == 'macos' && github.event_name == 'push' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && github.event_name == 'push' && secrets.MAC_CERTS_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && github.event_name == 'push' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && github.event_name == 'push' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          EXTRA=""
          # PR review artifacts: host-arch (arm64) dmg only — halves the
          # upload; main builds both architectures
          if [[ "${{ matrix.name }}" == "macos" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXTRA="--arm64 --x64"
          fi
          if [[ "${{ matrix.name }}" == "macos" ]]; then
            if [[ -z "$CSC_LINK" ]]; then
              # unsigned build: don't pick up stray identities from the runner
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            fi
            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" && -n "${CSC_LINK:-}" ]]; then
              EXTRA="$EXTRA -c.mac.notarize=true"
            else
              # partial APPLE_* env makes electron-builder throw even without
              # notarize=true — scrub it so signing-only builds stay green
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            fi
          fi
          npm run dist -w @dcl-editor/desktop -- ${{ matrix.args }} $EXTRA
      - name: Measure image size
        run: node scripts/measure-size.mjs --out size-reports/${{ matrix.name }}.json
      # 90 days: these are the size baseline for future PRs — if main goes
      # quiet longer than the retention, PRs lose the growth gate (budgets
      # still apply) until the next main push re-measures
      - uses: actions/upload-artifact@v7
        with:
          name: size-${{ matrix.name }}
          path: size-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'macos' && github.event_name == 'push'
        with:
          name: bevy-editor-macos-x64
          path: packages/desktop/release/*-x64.dmg
          if-no-files-found: error
          retention-days: 14
      # surface the download right on the PR — artifacts otherwise hide on the
      # Actions run page. Sticky per-platform comment, updated on each push.
      # continue-on-error: fork PRs get a read-only token and can't comment.
      - name: Link image on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- bevy-editor-image-${{ matrix.name }} -->'
            const body = marker + '\n📦 **${{ matrix.name }} image** (commit ${{ github.event.pull_request.head.sha }}): ' +
              '[download](${{ steps.upload.outputs.artifact-url }}) — expires in 14 days'
            const { data: comments } = await github.rest.issues.listComments(
              { ...context.repo, issue_number: context.issue.number })
            const existing = comments.find(c => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }

  # Size gate: a PR's images are compared against the size artifacts of the
  # target branch's latest successful run — no committed measurements, so
  # nothing can go stale. Fails when an image blows its app-size.json budget or
  # grows more than maxGrowthMb vs main; raising either is a deliberate line in
  # the PR diff. On main it only reports — there is nothing left to gate once
  # the merge happened (signed main images measure a few bytes off unsigned PR
  # builds; that's well inside maxGrowthMb).
  size:
    name: app size
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: size-*
          merge-multiple: true
          path: size-reports
      # the baseline: what the target branch's latest successful run measured.
      # Missing artifacts (first run, retention expired) skip the growth gate —
      # the report says so loudly and budgets still apply.
      - name: Fetch the target branch's measured sizes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/desktop-images.yml/runs?branch=${{ github.base_ref }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'size-*' --dir base-size-reports \
              || echo "::warning::size artifacts of run $run_id unavailable — growth not gated"
          else
            echo "::warning::no successful '${{ github.base_ref }}' build found — growth not gated"
          fi
      - name: Check size against the baseline
        id: check
        run: |
          node scripts/size-check.mjs \
            --measured size-reports \
            --out size-report.md \
            ${{ github.event_name == 'pull_request' && '--base base-size-reports' || '--report-only' }}
      # runs on failure too: the report IS the failure message, and forks that
      # can't comment still get it here
      - name: Job summary
        if: always()
        run: cat size-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Comment the size diff on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- bevy-editor-app-size -->'
            const body = marker + '\n' + fs.readFileSync('size-report.md', 'utf8')
            const { data: comments } = await github.rest.issues.listComments(
              { ...context.repo, issue_number: context.issue.number })
            const existing = comments.find(c => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
