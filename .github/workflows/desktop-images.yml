# Build installable desktop images (macOS dmg, Windows installer) on every PR
# and on every push to main, and attach them as workflow artifacts.
#
# Signing policy:
#   - PR builds are always UNSIGNED (fork PRs can't see secrets, and unsigned
#     is faster for review artifacts).
#   - main builds sign when the secrets exist, and notarize the mac image when
#     the APPLE_* secrets exist. Missing secrets degrade to unsigned — the
#     build never fails over signing config.
#
# Repo secrets used (all optional): MAC_CERTS (base64 .p12), MAC_CERTS_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, WIN_CSC_LINK (base64
# .pfx), WIN_CSC_KEY_PASSWORD.
name: desktop images

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: desktop-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --mac
            artifacts: packages/desktop/release/*.dmg
          - name: windows
            os: windows-latest
            args: --win
            artifacts: packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the full gate (typecheck + unit tests + build) — packaging a broken
      # build is worse than a slower job
      - run: npm run validate
      - name: Package image
        shell: bash
        env:
          # CSC_LINK is read by BOTH platform signers — scope each cert to its job
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CERTS_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && github.event_name == 'push' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && github.event_name == 'push' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [[ "${{ matrix.name }}" == "macos" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "push" || -z "$CSC_LINK" ]]; then
              # unsigned build: don't pick up stray identities from the runner
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            elif [[ -n "$APPLE_ID" ]]; then
              EXTRA="-c.mac.notarize=true"
            fi
          fi
          npm run dist -w @dcl-editor/desktop -- ${{ matrix.args }} $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: bevy-editor-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
